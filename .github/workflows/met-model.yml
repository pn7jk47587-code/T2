name: Met 3D-Modell laden

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harnisch Heinrichs II. laden (Met, CC0)
        run: |
          mkdir -p pub && cd pub
          curl -sSfL -o henry2.glb "https://api.vntana.com/assets/products/7431e6e3-5a90-4e1d-b2e7-816c981e5cea/organizations/The-Metropolitan-Museum-of-Art/clients/masters/dc109b64-de74-4d88-afb4-a0d6176ec37a.glb"
          ls -la henry2.glb > info.txt
          npx -y @gltf-transform/cli@4 inspect henry2.glb >> info.txt 2>&1 || true
      - name: In Zweig met-data ablegen
        working-directory: pub
        run: |
          git init -q -b met-data
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "Harnisch Heinrichs II., Met 39.121a-n, CC0"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" met-data
