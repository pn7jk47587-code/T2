name: Met 3D-Modell suchen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser installieren
        run: |
          mkdir -p work && cd work && npm init -y >/dev/null && npm i playwright@1 @gltf-transform/cli@4 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Seite öffnen und 3D-Dateien mitschneiden
        working-directory: work
        run: |
          mkdir -p out model
          cp ../.github/met/find.mjs .
          node find.mjs || echo "Skriptfehler $?" >> out/title.txt
          ls -la model out >> out/title.txt
          for f in model/*.glb; do [ -f "$f" ] && npx gltf-transform inspect "$f" > "out/inspect-$(basename $f).txt" 2>&1 || true; done
      - name: Ergebnis in Zweig met-data ablegen
        working-directory: work
        run: |
          mkdir pub && cp -r out pub/
          find model -name "*.glb" -size -95M -exec cp {} pub/ \; || true
          cd pub
          git init -q -b met-data
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "Suchergebnis"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" met-data
