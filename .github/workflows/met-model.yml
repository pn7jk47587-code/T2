name: Met 3D-Modell suchen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Objektseite laden und nach 3D-Dateien suchen
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          curl -sSL -A "$UA" -o out/page.html -w "HTTP %{http_code} %{size_download} bytes\n" https://www.metmuseum.org/art/collection/search/24671 > out/find.txt 2>&1 || true
          echo "--- glb/usdz/fbx/masters ---" >> out/find.txt
          grep -oiE '[^"'"'"' \\]*(\.glb|\.usdz|\.fbx|masters)[^"'"'"' \\]*' out/page.html | sort -u | head -80 >> out/find.txt || true
          echo "--- 3d/model ---" >> out/find.txt
          grep -oiE '.{0,120}(3d|model3d|threeD|gltf).{0,160}' out/page.html | head -40 >> out/find.txt || true
      - name: Ergebnis in Zweig met-data ablegen
        run: |
          cd out
          git init -q -b met-data
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "Suchergebnis"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" met-data
